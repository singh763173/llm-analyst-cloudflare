name = "llm-analyst"
main = "functions/scheduled-scrape.js"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "LLM_ANALYST_CACHE"
# Create with: npx wrangler kv namespace create "LLM_ANALYST_CACHE"
# Then paste the returned id here before deploying.
id = "YOUR_KV_NAMESPACE_ID"

[site]
bucket = "."

pages_build_output_dir = "."

# Cron trigger: rescrape the Ollama library once per hour
[[triggers]]
crons = ["0 * * * *"]
