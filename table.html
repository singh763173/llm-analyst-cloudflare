<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Analyst — Full Table</title>
  <meta name="description" content="Full table view of Ollama models with categories, sizes and capabilities.">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/css/styles.css?v=2" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script src="https://unpkg.com/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <i class="ph ph-brain"></i>
        <span>LLM Analyst</span>
      </a>
      <nav class="nav">
        <a href="/">Cards</a>
        <a href="/table.html" class="active">Full Table</a>
      </nav>
      <div class="header-actions">
        <button id="refreshBtn" class="btn btn-secondary">
          <i class="ph ph-arrows-clockwise"></i>
          <span>Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:1.5rem">
    <h1 style="color:var(--navy);margin-bottom:1rem">Full Model Table</h1>
    <p id="statusLine" class="status-line"><i class="ph ph-spinner ph-spin"></i> Loading models…</p>

    <div class="table-container">
      <table class="models-table" id="modelsTable">
        <thead>
          <tr>
            <th data-sort="name">Name</th>
            <th data-sort="primary_category">Category</th>
            <th data-sort="size_band">Size</th>
            <th>Capabilities</th>
            <th data-sort="pull_value" data-sort-type="numeric">Pulls</th>
            <th data-sort="estimated_updated_iso" data-sort-type="date">Updated</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Built for LLM Analyst · Data from <a href="https://ollama.com/library" target="_blank" rel="noopener">ollama.com/library</a></p>
    </div>
  </footer>

  <script src="/js/app.js?v=2"></script>
  <script>
    let tableModels = [];
    let tableSort = { key: null, dir: 'asc' };

    document.addEventListener('DOMContentLoaded', () => {
      initApp('table');
      loadTable();
      bindTableSort();
    });

    async function loadTable() {
      const status = document.getElementById('statusLine');
      try {
        const resp = await fetch('/api/models');
        const data = await resp.json();
        tableModels = data.models || [];
        renderTable(tableModels);
        status.innerHTML = `<i class="ph ph-check-circle"></i> ${tableModels.length} models loaded`;
      } catch (e) {
        status.innerHTML = `<i class="ph ph-warning-circle"></i> Failed: ${e.message}`;
      }
    }

    function renderTable(models) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = models.map(m => `
        <tr>
          <td><a href="${m.ollama_url}" target="_blank" rel="noopener">${m.name}</a></td>
          <td>${m.primary_category || m.categories?.[0] || ''}</td>
          <td>${m.size_band || 'Unknown'}</td>
          <td>${Object.entries(m.capabilities || {}).filter(([_,v])=>v).map(([k])=>k).join(', ')}</td>
          <td data-numeric="${numericPull(m.pull_value || m.pull_count)}">${m.pull_value || formatPullCount(m.pull_count) || ''}</td>
          <td data-date="${m.estimated_updated_iso || ''}">${m.relative_updated || ''}</td>
        </tr>
      `).join('');
    }

    function bindTableSort() {
      document.querySelectorAll('#modelsTable th[data-sort]').forEach(th => {
        th.style.cursor = 'pointer';
        th.addEventListener('click', () => {
          const key = th.dataset.sort;
          const type = th.dataset.sortType || 'string';
          if (tableSort.key === key) {
            tableSort.dir = tableSort.dir === 'asc' ? 'desc' : 'asc';
          } else {
            tableSort = { key, dir: 'asc' };
          }
          document.querySelectorAll('#modelsTable th').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
          th.classList.add(tableSort.dir === 'asc' ? 'sort-asc' : 'sort-desc');
          const sorted = sortModels(tableModels, key, type, tableSort.dir);
          renderTable(sorted);
        });
      });
    }

    function sortModels(models, key, type, dir) {
      const sorted = [...models].sort((a, b) => {
        let va = a[key];
        let vb = b[key];
        if (type === 'numeric') {
          va = numericPull(va || a.pull_count);
          vb = numericPull(vb || b.pull_count);
        } else if (type === 'date') {
          va = new Date(va || 0).getTime();
          vb = new Date(vb || 0).getTime();
        } else {
          va = String(va || '').toLowerCase();
          vb = String(vb || '').toLowerCase();
        }
        if (va < vb) return dir === 'asc' ? -1 : 1;
        if (va > vb) return dir === 'asc' ? 1 : -1;
        return 0;
      });
      return sorted;
    }

    function numericPull(text) {
      if (!text) return 0;
      const m = String(text).match(/([\d,]+(?:\.\d+)?)\s*([KMB]?)/i);
      if (!m) return 0;
      const raw = parseFloat(m[1].replace(/,/g, ''));
      const mult = { K: 1e3, M: 1e6, B: 1e9 }[m[2].toUpperCase()] || 1;
      return raw * mult;
    }
  </script>
</body>
</html>
